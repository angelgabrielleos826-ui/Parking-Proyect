name: ZAP API Scan (seguridad)

on:
  workflow_dispatch:

jobs:
  zap-api:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el servicio (plan gratis de Render)
        run: curl -sf --retry 10 --retry-delay 6 --max-time 60 https://parking-proyect.onrender.com/health

      - name: Escaneo OWASP ZAP contra la definición OpenAPI
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "https://parking-proyect.onrender.com/openapi.json"
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: reporte-zap-api
