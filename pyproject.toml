[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "map_loader"
version = "0.1.0"
description = "Librería privada para el cargado, validación y almacenamiento de mapas del microservicio Localizador de Cajón"
authors = [{name = "Tu Nombre", email = "tu@correo.com"}]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
where = ["src"]
